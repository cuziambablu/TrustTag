<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="wallBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="acCase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="copperPipe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
  </defs>

  <!-- Wall Background -->
  <rect x="0" y="0" width="800" height="500" fill="url(#wallBg)"/>

  <!-- AC Indoor Unit -->
  <rect x="150" y="100" width="500" height="190" rx="14" fill="url(#acCase)" stroke="#94A3B8" stroke-width="2"/>
  
  <!-- AC Air Louver / Flap -->
  <rect x="175" y="240" width="450" height="30" rx="4" fill="#94A3B8"/>
  <line x1="175" y1="255" x2="625" y2="255" stroke="#64748B" stroke-width="2"/>

  <!-- Digital LED Display on AC -->
  <rect x="530" y="140" width="70" height="36" rx="6" fill="#020617"/>
  <text x="542" y="166" fill="#38BDF8" font-family="monospace" font-size="22" font-weight="700">22°C</text>

  <!-- Brand logo mark -->
  <circle cx="210" cy="155" r="8" fill="#0284C7"/>
  <text x="226" y="160" fill="#475569" font-family="sans-serif" font-size="12" font-weight="700">COOLFIX INVERTER</text>

  <!-- Insulated refrigerant pipe running downwards -->
  <path d="M570 290 L570 480" stroke="#334155" stroke-width="24" stroke-linecap="round"/>
  <path d="M570 290 L570 480" stroke="url(#copperPipe)" stroke-width="8" stroke-linecap="round"/>

  <!-- Serviced / Sealed Tag -->
  <rect x="525" y="340" width="90" height="40" rx="4" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="533" y="358" fill="#A7F3D0" font-family="sans-serif" font-size="10" font-weight="700">VALVE REPLACED</text>
  <text x="545" y="372" fill="#34D399" font-family="monospace" font-size="9">PRESSURE OK</text>

  <!-- Photo stamp -->
  <rect x="20" y="20" width="170" height="28" rx="6" fill="#0F172A" opacity="0.8"/>
  <circle cx="34" cy="34" r="5" fill="#10B981"/>
  <text x="46" y="38" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="11" font-weight="600">PHOTO_EVIDENCE_1040</text>

  <!-- Verification badge -->
  <g id="repairTag" opacity="0.95">
    <rect x="610" y="20" width="170" height="32" rx="6" fill="#0B132B" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="628" cy="36" r="6" fill="#10B981"/>
    <text x="642" y="40" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="11" font-weight="600">COIL & VALVE REPLACED</text>
  </g>
</svg>
