<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <!-- Dim lighting & glare gradient -->
    <linearGradient id="dimWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D3D3A"/>
      <stop offset="50%" stop-color="#4A4A46"/>
      <stop offset="100%" stop-color="#2B2B28"/>
    </linearGradient>
    <radialGradient id="glare" cx="60%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3"/>
    </radialGradient>
    <linearGradient id="floorDim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D2013"/>
      <stop offset="100%" stop-color="#1A120B"/>
    </linearGradient>
  </defs>

  <!-- Dim Room Background -->
  <rect x="0" y="0" width="800" height="380" fill="url(#dimWall)"/>

  <!-- High Glare / Lens Flare Over Ceilings & Walls (Causing Occlusion) -->
  <circle cx="500" cy="120" r="220" fill="url(#glare)"/>
  <rect x="0" y="0" width="800" height="90" fill="#222220" opacity="0.85"/>
  <line x1="0" y1="90" x2="800" y2="90" stroke="#555550" stroke-dasharray="4,4" stroke-width="1.5"/>

  <!-- Uncaptured / Missing Ceiling Region Overlay -->
  <rect x="40" y="20" width="300" height="55" rx="2" fill="#151515" opacity="0.9" stroke="#B45309" stroke-width="1"/>
  <text x="55" y="44" fill="#F59E0B" font-family="monospace" font-size="11" font-weight="700">⚠ CEILING PLANE OCCLUDED</text>
  <text x="55" y="62" fill="#A8A29E" font-family="monospace" font-size="9.5">MISSING 2ND COAT PERSPECTIVE</text>

  <!-- Hardwood Floor Dim -->
  <polygon points="0,380 800,380 800,500 0,500" fill="url(#floorDim)"/>
  <line x1="200" y1="380" x2="140" y2="500" stroke="#3D2B1A" stroke-width="1.5"/>
  <line x1="450" y1="380" x2="430" y2="500" stroke="#3D2B1A" stroke-width="1.5"/>
  <line x1="680" y1="380" x2="700" y2="500" stroke="#3D2B1A" stroke-width="1.5"/>

  <!-- Furniture in shadow -->
  <rect x="220" y="300" width="280" height="70" rx="3" fill="#242422"/>
  <rect x="240" y="260" width="240" height="50" rx="3" fill="#2E2E2A"/>

  <!-- Low resolution & blur effect overlay -->
  <rect x="0" y="0" width="800" height="500" fill="#000000" opacity="0.15"/>

  <!-- Metadata Stamp -->
  <rect x="20" y="450" width="220" height="28" rx="2" fill="#151515" opacity="0.9"/>
  <circle cx="34" cy="464" r="3.5" fill="#B45309"/>
  <text x="46" y="468" fill="#F7F7F4" font-family="monospace" font-size="10" font-weight="600">EV-PHOTO-1044 // LOW-RES</text>

  <!-- Quality Diagnostic Tag -->
  <g id="qualityTag" opacity="0.95">
    <rect x="580" y="450" width="200" height="28" rx="2" fill="#151515" stroke="#B45309" stroke-width="1"/>
    <text x="592" y="468" fill="#FDE68A" font-family="monospace" font-size="10" font-weight="600">QUALITY: INSUFFICIENT (320p)</text>
  </g>
</svg>
