<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <!-- Wall Blue Gradient -->
    <linearGradient id="blueWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0.5"/>
    </linearGradient>
    <!-- Shadow -->
    <radialGradient id="cornerShadow" cx="0%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Main Back Wall (Blue) -->
  <rect x="0" y="0" width="800" height="360" fill="url(#blueWall)"/>
  
  <!-- Corner shadow -->
  <polygon points="0,0 800,0 720,360 80,360" fill="url(#cornerShadow)" opacity="0.3"/>

  <!-- Left Wall Perspective -->
  <polygon points="0,0 120,40 120,340 0,360" fill="#1D4ED8" opacity="0.8"/>
  <line x1="120" y1="40" x2="120" y2="340" stroke="#1E40AF" stroke-width="2"/>

  <!-- Right Wall Perspective -->
  <polygon points="800,0 680,40 680,340 800,360" fill="#1E3A8A" opacity="0.85"/>
  <line x1="680" y1="40" x2="680" y2="340" stroke="#1E3A8A" stroke-width="2"/>

  <!-- Baseboard trim -->
  <rect x="0" y="352" width="800" height="8" fill="#F8FAFC"/>
  
  <!-- Hardwood Floor -->
  <polygon points="0,360 800,360 800,500 0,500" fill="url(#floorGrad)"/>
  <!-- Floor Planks -->
  <line x1="100" y1="360" x2="60" y2="500" stroke="#5C2406" stroke-width="1.5" opacity="0.6"/>
  <line x1="250" y1="360" x2="210" y2="500" stroke="#5C2406" stroke-width="1.5" opacity="0.6"/>
  <line x1="400" y1="360" x2="380" y2="500" stroke="#5C2406" stroke-width="1.5" opacity="0.6"/>
  <line x1="550" y1="360" x2="550" y2="500" stroke="#5C2406" stroke-width="1.5" opacity="0.6"/>
  <line x1="700" y1="360" x2="720" y2="500" stroke="#5C2406" stroke-width="1.5" opacity="0.6"/>

  <!-- Modern Window on Back Wall -->
  <rect x="480" y="70" width="160" height="200" rx="4" fill="#0F172A" stroke="#FFFFFF" stroke-width="6"/>
  <rect x="486" y="76" width="70" height="90" fill="url(#windowLight)"/>
  <rect x="564" y="76" width="70" height="90" fill="url(#windowLight)"/>
  <rect x="486" y="174" width="70" height="90" fill="url(#windowLight)"/>
  <rect x="564" y="174" width="70" height="90" fill="url(#windowLight)"/>

  <!-- Window Sunlight Cast onto wall and floor -->
  <polygon points="480,270 640,270 740,460 520,460" fill="#FEF08A" opacity="0.12"/>

  <!-- Modern Bed / Furniture in foreground -->
  <rect x="200" y="270" width="260" height="50" rx="6" fill="#334155"/>
  <!-- Headboard -->
  <rect x="190" y="210" width="280" height="70" rx="8" fill="#1E293B"/>
  <!-- Mattress / Duvet -->
  <rect x="210" y="280" width="240" height="85" rx="6" fill="#F1F5F9"/>
  <!-- Pillows -->
  <rect x="225" y="250" width="95" height="35" rx="6" fill="#E2E8F0"/>
  <rect x="335" y="250" width="95" height="35" rx="6" fill="#E2E8F0"/>

  <!-- Nightstand and Lamp -->
  <rect x="140" y="290" width="55" height="70" rx="4" fill="#475569"/>
  <path d="M158 290 L168 250 L178 290 Z" fill="#F8FAFC"/>
  <circle cx="168" cy="245" r="5" fill="#FDE047"/>

  <!-- Fresh Paint Roller Mark / Subtle visual cue -->
  <circle cx="340" cy="140" r="45" fill="#3B82F6" opacity="0.2"/>
  
  <!-- Photo Stamp metadata in corner -->
  <rect x="20" y="20" width="160" height="24" rx="2" fill="#151515" opacity="0.9"/>
  <circle cx="32" cy="32" r="3.5" fill="#B91C1C"/>
  <text x="44" y="36" fill="#F7F7F4" font-family="monospace" font-size="10" font-weight="600">EV-PHOTO-1043</text>

  <!-- Color tag identifier overlay -->
  <g id="colorBadge" opacity="0.95">
    <rect x="630" y="20" width="150" height="24" rx="2" fill="#151515" stroke="#333333" stroke-width="1"/>
    <rect x="636" y="25" width="14" height="14" rx="1" fill="#2563EB"/>
    <text x="658" y="36" fill="#FFFFFF" font-family="monospace" font-size="10" font-weight="600">DOMINANT: BLUE</text>
  </g>
</svg>
